name: Deploy Azure VM

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'vm.bicep' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        if: ${{ !contains(steps.resource-group-check.outputs.exists, 'true') }}
        run: |
          az group create \
            --name bicep-rg \
            --location eastus

      - name: Deploy VM
        run: |
          az deployment group create \
            --resource-group bicep-rg \
            --template-file vm.bicep \
            --parameters \
                vmName='github-vm' \
                adminUsername='azureuser' \
                adminPassword='${{ secrets.VM_PASSWORD }}'