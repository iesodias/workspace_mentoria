name: Deploy Azure VM

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'files/vm.bicep'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check/Create Resource Group
        id: rg-check
        run: |
          if ! az group show --name bicep-rg --query id -o tsv 2>/dev/null; then
            az group create --name bicep-rg --location eastus
            echo "Resource Group criado"
          else
            echo "Resource Group já existe"
          fi

      - name: Deploy VM
        run: |
          az deployment group create \
            --resource-group bicep-rg \
            --template-file files/vm.bicep \
            --parameters \
                vmName='github-vm-${{ github.run_id }}' \
                adminUsername='azureuser' \
                adminPassword='${{ secrets.VM_PASSWORD }}'